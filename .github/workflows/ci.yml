name: CI

on:
  push:
  pull_request:

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash syntax check
        run: bash -n sddmstyler && bash -n install.sh

      - name: shellcheck
        run: shellcheck sddmstyler
        if: always()